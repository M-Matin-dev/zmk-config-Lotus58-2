# Uncomment the following line to enable the Lotus58 OLED Display
# CONFIG_ZMK_DISPLAY=y


# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# mouse
CONFIG_ZMK_POINTING=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Peripheral battery: track right-side level and re-advertise it to the host OS.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Custom nice!view widget: disable the built-in widget so the shield does not
# compile its status.c (which hardcodes WPM via `select ZMK_WPM`).  Our own
# status.c in nice_view/widgets/ is compiled by the repo-root CMakeLists.txt
# instead.  Explicitly enable the LVGL features the built-in widget would have
# pulled in via `select`.
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_CANVAS=y

# sleep settings
# currently set to 30 mins
# CONFIG_ZMK_SLEEP=y  (off for the battery test, see below)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_ZMK_KEYBOARD_NAME="Lotus58Wireless"

# ── Battery test (battery-logger branch only) ──
# Logs voltage, USB power and split link events to flash; read over USB serial.
CONFIG_LOTUS58_BATTERY_LOG=y
CONFIG_LOTUS58_BATTERY_LOG_INTERVAL_MIN=15
# Blue LED on and CPU kept awake, so the 750 mAh battery empties in days, not weeks.
CONFIG_LOTUS58_BATTERY_LOG_LOAD=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
# No deep sleep during the test, so the halves run until the battery is flat.
CONFIG_ZMK_SLEEP=n

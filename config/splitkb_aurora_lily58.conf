# Aurora Lily58 (58 keys, nice!nano v2 + nice!view on the left half).
# Same settings as config/lotus58.conf, minus the Lotus battery test logger.

# Encoders: the upstream Aurora Lily58 left/right overlays enable the EC11 nodes.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# mouse
CONFIG_ZMK_POINTING=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Peripheral battery: track right-side level and re-advertise it to the host OS.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Custom nice!view widget (see CMakeLists.txt and lotus58.conf for the reason).
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_CANVAS=y

# sleep: 30 minutes, as in lotus58.conf
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_ZMK_KEYBOARD_NAME="Aurora58"

# Per-key LEDs (chain from the ZMK shield; length set in the keymap). Without
# CONFIG_ZMK_RGB_UNDERGLOW the LED driver is not built. Start on at boot.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# LEDs start as white at 10% brightness (saturation 0 = white), solid effect.
# A colour already saved in flash takes priority; Adjust + T restores this.
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

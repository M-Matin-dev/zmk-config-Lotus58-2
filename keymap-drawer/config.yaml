draw_config:
  dark_mode: false
  append_colon_to_layer_header: false
  draw_key_sides: false
  svg_extra_style: |
    svg.keymap { font-family: "JetBrains Mono", SFMono-Regular, Consolas, monospace; }
    rect.key { rx: 7; }
parse_config:
  trans_legend: {t: '▽', type: trans}
  raw_binding_map:
    '&os_mode OS_TOG': {t: 'OS', s: 'Mac/Win'}
    '&os_mode OS_MAC': 'Mac mode'
    '&os_mode OS_WIN': 'Win mode'
    # Profiles are numbered from 1 to match the nice!view (ZMK's BT_SEL 0 = profile 1).
    '&bt BT_SEL 0': 'BT 1'
    '&bt BT_SEL 1': 'BT 2'
    '&bt BT_SEL 2': 'BT 3'
    '&bt BT_SEL 3': 'BT 4'
    '&bt BT_SEL 4': 'BT 5'
    '&mmv MOVE_UP': 'Mouse ↑'
    '&mmv MOVE_DOWN': 'Mouse ↓'
    '&mmv MOVE_LEFT': 'Mouse ←'
    '&mmv MOVE_RIGHT': 'Mouse →'
    '&msc SCRL_UP': 'Scroll ↑'
    '&msc SCRL_DOWN': 'Scroll ↓'
    '&mkp LCLK': 'L Click'
    '&mkp RCLK': 'R Click'
    '&bootloader': 'Boot loader'
    '&sys_reset': 'Reset'
    '&bt BT_CLR_ALL': 'BT Clear all'
  zmk_keycode_map:
    C_MUTE: 'Mute'
    K_CMENU: 'Menu'
    PAUSE_BREAK: 'Pause'
    SLCK: 'Scroll Lock'
    CLCK: 'Caps'
    PSCRN: 'PrtSc'
    LS(SQT): '"'
    LS(COMMA): '<'
    LS(DOT): '>'
